<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hekatean-Orphic Mystery — Mermaid Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, "Arial Unicode MS", "Apple Color Emoji", sans-serif; }
    body { margin: 0; background: #101820; color: #f2f5f8; }
    header { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; align-items: center;
      padding: 12px 18px; background: rgba(16,24,32,.96); border-bottom: 1px solid #617180; }
    a, button { color: #8dcbf4; }
    button { border: 1px solid #617180; border-radius: 6px; padding: 6px 10px; background: #263745; cursor: pointer; }
    main { padding: 20px; overflow: auto; }
    #diagram { min-width: 1200px; }
    #diagram svg { max-width: none !important; height: auto; }
    #diagram .cluster-label .nodeLabel div { text-align: center !important; }
    #diagram g.node foreignObject > div { line-height: 1.35 !important; }
    #error { display: none; white-space: pre-wrap; padding: 16px; color: #ffd2d2; }
  </style>
</head>
<body>
  <header><strong>Hekatean-Orphic-Mystery</strong>[ <a href="Hekatean-Orphic-Mystery.mmd">Mermaid MMD</a> | <a href="Hekatean-Orphic-Mystery.png">PNG</a> | <a href="Hekatean-Orphic-Mystery.svg">SVG</a> ]</header>
  <input id="file" type="file" accept=".mmd,text/plain" hidden>
  <div id="error"><span id="error-text"></span><br><button id="choose" type="button" hidden>Choose .mmd file</button></div>
  <main><div id="diagram"></div></main>
  <script src="mermaid.min.js"></script>
  <script>
    const sourceName = "Hekatean-Orphic-Mystery.mmd";
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
    async function renderSource(source) {
      document.getElementById('error').style.display = 'none';
      document.getElementById('diagram').replaceChildren();
      const { svg, bindFunctions } = await mermaid.render('hekateanOrphicMystery-' + Date.now(), source);
      const host = document.getElementById('diagram'); host.innerHTML = svg;
      bindFunctions?.(host);
    }

    function showError(error) {
      const box = document.getElementById('error'); box.style.display = 'block';
      document.getElementById('error-text').textContent = String(error?.stack || error);
      document.getElementById('choose').hidden = false;
    }

    async function loadAdjacentSource() {
      const response = await fetch(sourceName + '?v=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('Could not load ' + sourceName + ' (' + response.status + ')');
      return response.text();
    }

    const picker = document.getElementById('file');
    document.getElementById('choose').addEventListener('click', () => picker.click());
    picker.addEventListener('change', async () => {
      const file = picker.files?.[0];
      if (file) renderSource(await file.text()).catch(showError);
    });

    if (location.protocol === 'file:') {
      showError('Direct-file mode: choose the adjacent Hekatean-Orphic-Mystery.mmd file, or use the included preview launcher for automatic loading.');
    } else {
      loadAdjacentSource().then(renderSource).catch(error => {
        showError(error.message + '\n\nClick “Choose .mmd file” to select the source manually.');
      });
    }
  </script>
</body>
</html>
