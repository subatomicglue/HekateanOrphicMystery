2 (c. 700 BCE)<br/>ATHENIAN AGORA · SGD 21 / SEG 30.326, 17–19 (c. 1st c. CE)</span></div>\"]\n    direction BT\n    subgraph ROADS_ROW[\" \"]\n      direction LR\n      P[\"<b>FACE · PERSEPHONE 💀</b><br/><span style='color:#b5c2cc'>ROAD · </span>Descent ⬇️<br/><span style='color:#b5c2cc'>DOMAIN · </span><b>UNDERWORLD⁴ ⬛</b> · <span style='color:#b5c2cc'>ᾍδης</span>\"] ~~~ A[\"<b>FACE · APHRODITE ❤️</b><br/><span style='color:#b5c2cc'>ROAD · </span>Ascent ⬆️<br/><span style='color:#b5c2cc'>DOMAIN · </span><b>HEAVEN ✨</b> · <span style='color:#b5c2cc'>Οὐρανός</span>\"] ~~~ R[\"<b>FACE · ARTEMIS 🦌 🏹</b><br/><span style='color:#b5c2cc'>ROAD · </span>Return ➕<br/><span style='color:#b5c2cc'>DOMAIN · </span><b>EARTH 🌍</b> · <span style='color:#b5c2cc'>Γαῖα</span>\"]\n    end\n    ROAD_SEQUENCE[\"<b>Earth 🌍 → Underworld ⬛ → Heaven ✨ → Earth 🌍</b><br/><span style='color:#b5c2cc'>Initiatory sequence<br/>PINDAR FR. 133 · ORPHIC GOLD TABLETS (THURII) · PLATO, REPUBLIC 10.614b–621d</span>\"]\n    ROAD_SEQUENCE ~~~ ROADS_ROW\n  end\n  ROADS_PANEL --> ISIS_PANEL\n\n  subgraph ISIS_PANEL[\"<div style='text-align:center'><b style='color:#f2f5f8'>ISIS ☥</b><br/><b style='color:#f2f5f8'>MANY-NAMED · MANY-FORMED GODDESS</b><br/><span style='color:#b5c2cc'>ISIDORUS · HYMN TO ISIS 1.14–26 (c. 100–80 BCE)<br/>P.OXY. XI 1380 · HYMN TO ISIS (2nd c. CE)<br/>One divine power · Multiple identities and manifestations</span><br/><b style='color:#f2f5f8'>Leader of the Muses · μουσαναγωγός</b><br/><span style='color:#b5c2cc'>P.OXY. XI 1380.62</span></div>\"]\n    direction BT\n    subgraph ISIS_ROW1[\" \"]\n      direction LR\n      I_HEK[\"<b>🌒 🌕 🌘 HEKATE ⊕ 🔥🔥</b><br/><span style='color:#b5c2cc'>Crossroads · Guidance</span>\"] ~~~ I_ART[\"<b>ARTEMIS / DIANA⁶ 🌍 🦌 🏹</b><br/><span style='color:#b5c2cc'>Earth · Wilds</span>\"] ~~~ I_PER[\"<b>PERSEPHONE / AMPHITRITE⁴ 💀</b><br/><span style='color:#b5c2cc'>Underworld · Abyss · Chthonic</span>\"]\n    end\n    subgraph ISIS_ROW2[\" \"]\n      direction LR\n      I_SEL[\"<b>SELENE 🌙</b><br/><span style='color:#b5c2cc'>Moon · Invocation</span>\"] ~~~ I_APH[\"<b>APHRODITE ❤️</b><br/><span style='color:#b5c2cc'>Ouranos · Desire</span>\"] ~~~ I_HER[\"<b>HERA 👑</b><br/><span style='color:#b5c2cc'>Marriage · Sovereignty</span>\"]\n    end\n    subgraph ISIS_ROW3[\" \"]\n      direction LR\n      I_DEM[\"<b>DEMETER 🌾</b><br/><span style='color:#b5c2cc'>Grain · Mysteries</span>\"] ~~~ I_RHE[\"<b>RHEA 🤱</b><br/><span style='color:#b5c2cc'>Divine Mother</span>\"] ~~~ I_HES[\"<b>HESTIA 🔥</b><br/><span style='color:#b5c2cc'>Sacred Hearth</span>\"]\n    end\n\n    ISIS_ROW3 ~~~ ISIS_ROW2 ~~~ ISIS_ROW1\n  end\n\n  ISIS_PANEL --> TITLE\n  TITLE[\"<b>HEKATEAN · ORPHIC MYSTERY (ΜΥΣΤΗΡΙΟΝ) 🗝️</b><br/><span style='color:#b5c2cc'><span style='font-size:15px'><b>YOUR MAP TO THE MYSTERY</b></span><br/><span style='font-size:16px'><b>READ FROM THE BOTTOM UP</b></span><br/><span style='color:#f2f5f8'><span style='font-size:14px'>THE SAME MYSTERY MAP APPEARS ACROSS THESE TRADITIONS</span></span><br/><span style='font-size:12.5px'><i>ORPHIC-BACCHIC-DIONYSIAN · ELEUSINIAN · ISIS · SAMOTHRACIAN · ECHIDNAIC</i><br/><i>MITHRAIC · APOLLONIAN-DELPHIC/PYTHIAN · ASCLEPIAN · SIBYLLINE</i></span><br/><span style='font-size:11.5px'>ORPHEUS · HEROIC AGE · BEFORE TROY (13th c. BCE) · PINDAR, PYTHIAN 4.176–177 (WRITTEN 462 BCE)<br/>HEKATE · HESIOD, THEOGONY 411–452 (c. 700 BCE) · DIONYSOS · LINEAR B KH Gq 5 (13th c. BCE)</span></span>\"]\n\n  FOOTNOTES[\"<div style='text-align:left;width:1050px'><b>EXPLANATORY FOOTNOTES</b><br/><br/><b>¹</b> The priestess must become Hekate—she of many names and faces—in order to access the crossroads. (+): Earth runs horizontally, with paths descending to the Underworld and ascending to Ouranos. These three realms will take the priestess to commune with one of Medea-Hekate’s many identities; her many identities will help her travel: Persephone taking the path to the underworld, Aphrodite taking her to Ouranos, then seeking Artemis to go back to Earth, to use the three faces of her training to invoke travel on the crossroads in order to access one of her identities.<br/><br/><b>²</b> The biblical cross (+) may represent a crossroads: its horizontal axis signifies Earth, its upward vertical axis Ouranos (Heaven), and its downward vertical axis Gaia (Underworld). This could reflect the same three-realm structure associated with Hekate and her crossroads, suggesting a derived tradition or knowledge of that cosmology.<br/><br/><b>³</b> The crucifix (+) hides the Christian mystery it was using from a previous tradition in plain sight, for eyes to see. Jesus can be best understood in the context of the chthonic mother he was calling for while on the cross. This is the internal/hidden Christian mystery. He accomplished the keys to the mystery himself within the rite described in Revelation of John.<br/><br/><b>⁴</b> An alternative older Pontic tradition defines Realms as [Sea, Heaven, Earth] instead of [Underworld, Heaven, Earth], but both are equivalent (as Abyss or Void). Queen Amphitrite is the guide to Pontos (Sea), where queen Persephone is the guide to Hades (Underworld). Medea comes from Colchis on the Pontic Sea; she directs Hekate’s rites on its coast. Incidentally, the Sea Peoples migrated during the Late Bronze Age collapse. This may explain the regional ubiquity of the Hecatean / Orphic kosmology, in the Greek and Roman empires. Hesiod, Theogony 411–427 (c. 700 BCE); Apollonius Rhodius, Argonautica 4.245–252 (3rd c. BCE); Orphic Hymn 1.1–3 (Roman imperial period).<br/><br/><b>⁵</b> Medea and Ammon. Medea (Μήδεια), Ammon’s (Ἄμμων) earliest priestess (citation needed). Pindar, Pythian 4.1–58 (462 BCE): Medea’s prophecy concerning Libya and Zeus Ammon.<br/><br/><b>⁶</b> Diana, Dionysos and Bacchus. Diana and Dionysos: proposed linguistic connection. Dionysos is attested in Mycenaean Linear B as di-wo-nu-so (PY Ea 102; KH Gq 5, Late Bronze Age). Bacchus (Βάκχος) comes to us from the Greek in the fifth-century BCE Berezan dedication, SEG 32.745 ([Διονύ]σωι Βά[κχωι]), and the Olbian graffito Dettori 1996, 301a (BAKXO). Diana is the Roman/Italic goddess historically identified with Greek Artemis, both represent the wild hunt on Earth.<br/><br/><b>⁷</b> The ritual formularies. The Greek and Egyptian Magical Formularies preserve a recurring ritual vocabulary of divine names, multiple identities, φάρμακα, material preparations, invocations, and transformations. GEMF 15.419–432; GEMF 28.72–84; GEMF 57 / PGM IV.2785–2890.<br/><br/><b>⁸</b> 7 Stars or Aions, give us relevant guidance as well. Plato, Republic 616c–617c; PGM XIII.24–26 (= GEMF 60); Revelation 1:4, 1:12, 4:5, 1:16, 1:20, 2:1, 3:1, 5:6, 8:2; Julius Pollux, Onomasticon 10.115.<br/><br/><b>⁹</b> behind every maenid is a satyr helping her find aphrodite; eunuchs are turned on/off for the domain of heaven (baselea of ouranos). Jesus: Matthew 19:12. Satyrs are attested in Priapus’s company at a Bacchic gathering; Ovid, Fasti 1.391–440.<br/><br/><b>¹⁰</b> Despoina and the four goddess names. Despoina (δέσποινα, Mistress/Lady) is the title used in the Selene prayer, whose four linked goddess identities are Selene/Mene, Hekate, Artemis, and Kore/Persephone: sea-born, night-roaming/night-crier, bull-faced/bull-eyed, many-formed/three-formed, and poison-arrow-shooting (ios arrow poisons; ἰοβόλος). Kore is Persephone; Pausanias explicitly compares the titles Despoina and Kore, although his Arcadian mystery account distinguishes the unnamed Arcadian Despoina, daughter of Demeter and Poseidon, from Kore/Persephone, daughter of Demeter and Zeus. In royal language Medea, daughter of King Aeetes, is the despoina/princess of Colchis. The Italian Bona Dea (“Good Goddess”) is likewise a protective title; Macrobius records an ancient identification of Bona Dea with Medea because of her medicinal herbs and the exclusion of men from the sanctuary. PGM IV.2241–2358; PGM IV.2785–2890; Pausanias 8.37.9; Apollonius Rhodius, Argonautica 3.241–244; Macrobius, Saturnalia 1.12.26.<br/><br/><b>¹¹</b> Medea’s story is being told through Iphigenia and Andromeda. Euripides’ Medea invokes Hekate as the mistress she honors above all and as her companion dwelling within (Medea 395–398). In Iphigenia among the Taurians, Artemis substitutes a deer for Iphigenia and makes her priestess (28–30), while Athena later establishes her rites (1446–1467); the Hesiodic tradition explicitly says Iphigenia became Hekate (Pausanias 1.43.1). Euripides’ lost Andromeda dramatized another bound maiden delivered from death (Euripides, Andromeda, frs. 114–156 Kannicht; Aristophanes, Thesmophoriazusae 1010–1135). Through these two heroines, Medea’s story is retold as the priestess becoming Hekate—or Hekate coming through Medea as her vessel.<br/><br/><b>¹²</b> The wine-treaders. Greek Isaiah does not merely stop wine production; it removes joy and rejoicing from the vineyards, stops the treading of wine, and silences the vintage cry: ‘the vintage cry has ceased’ (πέπαυται γὰρ κέλευσμα; Isaiah 16:10 LXX). This suppressed vintage shout is highly relevant to Bacchic tradition: Euripides’ Bacchae portrays Dionysian women bringing wine from the earth (Bacchae 704–711). Dionysos is already named in Mycenaean Linear B (PY Xa 102; KH Gq 5, c. 13th century BCE), roughly a millennium before the Greek Septuagint Isaiah of the 2nd century BCE; this establishes that the Bacchic tradition existed and was known far before the writing of YHWH, and was being suppressed by their newer cult.</div>\"]\n  FOOTNOTES ~~~ TY\n\n  classDef heading fill:#263745,stroke:#6bb5e9,color:#f2f5f8,stroke-width:2px;\n  classDef normal fill:#263745,stroke:#617180,color:#f2f5f8;\n  class TITLE,H,SEL heading;\n  class TY,ME,P,A,R,B_MEL,B_MNE,B_AOI,N_KAL,N_KLE,N_ERA,N_EUT,N_MEL,N_TER,N_POL,N_OUR,N_THA,I_HEK,I_ART,I_PER,I_SEL,I_APH,I_HER,I_DEM,I_RHE,I_HES normal;\n  style BOE fill:none,stroke:#617180,stroke-width:2px,stroke-dasharray:4 4\n  sty         primaryBorderColor: '#617180', lineColor: '#b5c2cc', clusterBkg: '#1c2935',
        clusterBorder: '#617180', fontFamily: 'Arial, Arial Unicode MS, Apple Color Emoji, sans-serif'
      }
    });
    mermaid.render('hekateanOrphicMystery', source).then(({ svg, bindFunctions }) => {
      const host = document.getElementById('diagram'); host.innerHTML = svg;
      host.querySelectorAll('[style*="#b5c2cc"]').forEach(element => {
        element.style.setProperty('color', '#b5c2cc', 'important');
      });
      host.querySelectorAll('[style*="#f2f5f8"]').forEach(element => {
        element.style.setProperty('color', '#f2f5f8', 'important');
      });
      const footnotes = [...host.querySelectorAll('g.node')].find(node =>
        node.textContent.includes('EXPLANATORY FOOTNOTES')
      );
      footnotes?.querySelector('.nodeLabel p')?.style.setProperty('color', '#b5c2cc', 'important');
      footnotes?.querySelector('.nodeLabel b')?.style.setProperty('color', '#f2f5f8', 'important');
      bindFunctions?.(host);
    }).catch(error => {
      const box = document.getElementById('error'); box.style.display = 'block'; box.textContent = String(error?.stack || error);
    });
  </script>
</body>
</html>
